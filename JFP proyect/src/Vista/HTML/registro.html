<!DOCTYPE html>
<!-- Página de registro: permite crear un nuevo usuario con rol y validación de contraseña -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/registro.css">
    <title>Registro</title>
</head>
<body>
    <!-- Contenedor principal de la página de registro -->
    <main class="registro">
        <header class="registro-header">
            <img src="../IMG/logo ITI.png" alt="logo iti" class="logo">
            <h1>Registro de Usuario</h1>
        </header>

        <!-- Formulario de registro: la vista captura la acción y la envía al controlador -->
        <form class="registro-form" action="../../../procesar_registro.php" method="POST" novalidate>
            <div class="registro-field">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="registro-field">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div class="registro-field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="registro-field">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="registro-field">
                <label for="confirm-password">Verificar contraseña:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <input type="hidden" name="estado" value="activo">

            <div class="registro-field">
                <label for="rol">Elige tu rol:</label>
                <select name="rol" id="rol">
                    <option value="solicitante">Solicitante</option>
                    <option value="soporte">Soporte</option>
                </select>
            </div>

            <div id="mensaje-registro" class="registro-mensaje" aria-live="polite"></div>

            <div class="registro-actions">
                <button type="submit">Registrar</button>
            </div>
        </form>

        <footer class="registro-footer">
            <a href="login.html">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </footer>
    </main>

    <script src="../JS/password.js" defer></script>
    <script src="../JS/registro.js" defer></script>
</body>
