<!DOCTYPE html>
<html lang="es">	
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../CSS/registro.css">
    <title>Registro</title>
</head>
	<body>
		<main class="registro">
			<header class="registro-header">
				<img src="../IMG/logo ITI.png" alt="logo iti" class="logo">
    			<h1>Registro de Usuario</h1>
			</header>

    		<form action="registro.html" method="post" class="registro-form">

				<div class="registro-field">
					<label for="nombre">Nombre:</label>
					<input type="text" id="nombre" name="nombre" required>
				</div>

				<div class="registro-field">
					<label for="apellido">Apellido:</label>
					<input type="text" id="apellido" name="apellido" required>
				</div>

				<div class="registro-field">
					<label for="email">Email:</label>
					<input type="email" id="email" name="email" required>
				</div>

				<div class="registro-field">
					<label for="password">Contraseña:</label>
					<input type="password" id="password" name="password" required>
				</div>

				<div class="registro-field">
					<label for="confirm-password">Verificar contraseña:</label>
					<input type="password" id="confirm-password" name="confirm_password" required>
				</div>

			<div class="registro-field">
				<label for="rol">Elige tu rol:</label>
				<select name="opciones" id="rol">
					<option value="Solicitante">Solicitante</option>
					<option value="Soporte">Soporte</option>
					<option value="Administrador">Administrador</option>
				</select>
			</div>

			<div class="registro-actions">
				<button type="submit">Registrar</button>
			</div>

			</form>

			<footer class="registro-footer">
				<a href="login.html">¿Ya tienes cuenta? Inicia sesión aquí</a>
			</footer>
		</main>
		<script src="../JS/password.js"></script>
	</body>
</html>
